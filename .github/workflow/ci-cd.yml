
name: React Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-docker-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy on Ubuntu Runner
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify runner and Docker
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "Operating system: $RUNNER_OS"
          docker --version
          docker info
          docker ps

      - name: Build React Docker image
        run: |
          docker build \
            -t react-app:${GITHUB_SHA} \
            -t react-app:latest .

      - name: Remove previous container
        run: |
          docker rm -f react-app || true

      - name: Deploy application
        run: |
          docker run -d \
            --name react-app \
            --restart unless-stopped \
            -p 8080:80 \
            react-app:${GITHUB_SHA}

      - name: Verify deployment
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              echo "Deployment successful!"
              exit 0
            fi
            sleep 2
          done

          docker logs react-app
          exit 1
