name: React Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-docker-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy React
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verify Ubuntu and Docker
      - name: Check environment
        run: |
          set -e
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          docker --version
          docker info

      # 3. Build the React production image
      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          docker build --pull \
            -t "react-app:${IMAGE_TAG}" \
            .

      # 4. Replace the running application
      - name: Deploy React container
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          docker rm -f react-app 2>/dev/null || true

          docker run -d \
            --name react-app \
            --restart unless-stopped \
            -p 8080:80 \
            "react-app:${IMAGE_TAG}"

      # 5. Verify the application responds
      - name: Verify deployment
        run: |
          set -e

          for attempt in $(seq 1 15); do
            if curl --fail --silent \
              http://127.0.0.1:8080/ \
              -o /dev/null; then
              echo "SUCCESS: React application is responding"
              docker ps --filter name=react-app
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: React application did not respond"
          docker logs --tail 100 react-app
          exit 1

      # 6. Show logs if any step fails
      - name: Troubleshoot deployment
        if: failure()
        run: |
          docker ps -a --filter name=react-app || true
          docker logs --tail 100 react-app || true
