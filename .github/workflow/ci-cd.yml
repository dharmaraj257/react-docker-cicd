
name: React Docker CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t react-app:${GITHUB_SHA} .
          docker tag react-app:${GITHUB_SHA} react-app:latest

      - name: Replace running container
        run: |
          docker rm -f react-app || true
          docker run -d \
            --name react-app \
            --restart unless-stopped \
            -p 8080:80 \
            react-app:${GITHUB_SHA}

      - name: Verify application
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              echo "Deployment successful"
              exit 0
            fi
            sleep 2
          done
          docker logs react-app
          exit 1
